services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: perch
      POSTGRES_PASSWORD: perch
      POSTGRES_DB: perch_brief
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perch -d perch_brief"]
      interval: 3s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 5
