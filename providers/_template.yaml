# Copy to providers/<name>.yaml and fill in. See spec: Provider spec.
name: example
category: hosting
deployable: true

cli:
  binary: example-cli
  commands:
    status: "example status --json"

api:
  base_url: "https://api.example.com"
  auth_header: "Authorization: Bearer {token}"
  endpoints:
    status: "GET /v1/status"
  # status_probe: rest | signed | none (default rest)
  # status_headers:
  #   Example-Version: "2024-01-01"

credentials:
  key: example_token
  prompt: "Example API token"
  env_aliases:
    - EXAMPLE_API_KEY

# Optional: .env vars that populate perch.yaml project/service (also used at runtime for status).
project_env_aliases:
  - EXAMPLE_PROJECT_ID
