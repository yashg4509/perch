# Docs: https://api-docs.inngest.com/ — v2 REST API; list envs verifies signing key or API key
name: inngest
category: jobs
deployable: false

api:
  base_url: "https://api.inngest.com/v2"
  auth_header: "Authorization: Bearer {token}"
  endpoints:
    status: "GET /envs"

credentials:
  key: inngest_signing_key
  prompt: "Inngest signing key or API token (app.inngest.com) for authenticated management calls"
  env_aliases:
    - INNGEST_SIGNING_KEY
