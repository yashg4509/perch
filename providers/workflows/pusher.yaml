# Docs: https://pusher.com/docs/channels/library_auth_reference/rest-api — requests require signed query parameters (auth_key, auth_timestamp, auth_version, auth_signature).
name: pusher
category: realtime
deployable: false

api:
  base_url: "https://api.pusher.com"
  auth_header: "Authorization: Bearer {token}"
  endpoints:
    status: "GET /apps/{project}/channels"
  status_probe: signed

credentials:
  key: pusher_http_api_token
  prompt: "Pusher app secret (PUSHER_SECRET); status probe also needs PUSHER_KEY and PUSHER_APP_ID in .env"
  env_aliases:
    - PUSHER_SECRET

project_env_aliases:
  - PUSHER_APP_ID

# PUSHER_CLUSTER (e.g. us2) selects api-{cluster}.pusher.com for signed status probes.
