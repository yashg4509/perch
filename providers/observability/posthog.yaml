# Docs: https://posthog.com/docs/api — US private API: us.posthog.com; EU: eu.posthog.com (app.posthog.com redirects to US)
name: posthog
category: analytics
deployable: false

api:
  base_url: "https://us.posthog.com/api"
  auth_header: "Authorization: Bearer {token}"
  endpoints:
    status: "GET /projects/"
    list_resources: "GET /projects/"

credentials:
  key: posthog_personal_api_key
  prompt: "PostHog personal API key (us.posthog.com or eu.posthog.com → Project → Settings → Personal API Keys)"
  env_aliases:
    - POSTHOG_PERSONAL_API_KEY
    - NEXT_PUBLIC_POSTHOG_KEY

project_env_aliases:
  - POSTHOG_PROJECT_ID
  - NEXT_PUBLIC_POSTHOG_PROJECT_ID
